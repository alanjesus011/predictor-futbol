name: Actualizar pronósticos

on:
  schedule:
    - cron: "17 12 * * *"   # todos los días 6:17 am hora de CDMX (12:17 UTC)
  workflow_dispatch:         # botón para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Correr el modelo
        run: python modelo.py

      - name: Guardar datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || (git commit -m "Pronósticos actualizados $(date -u +%F)" && git push)
